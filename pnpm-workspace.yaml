packages:
  - 'packages/backend'
  - 'packages/frontend'
  - 'packages/shared'

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': set this to true or false
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': set this to true or false
  bcrypt: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

preferWorkspacePackages: true
