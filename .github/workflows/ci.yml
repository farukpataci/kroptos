# CI — her push ve PR'da: kurulum, derleme, testler; boş Postgres'te migration + RLS.
# Yol haritası: docs/plans/surekli-teslim-yol-haritasi.md (adım 8).
# main ve staging dallarına yalnız bu iş yeşilken merge edilir (dal koruması GitHub ayarlarında).
name: CI

on:
  push:
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Yerelde kullanılan sürümle aynı: lockfile (v9.0) ve pnpm-workspace.yaml `allowBuilds` buna göre yazıldı.
  PNPM_VERSION: 12.8.1
  NODE_VERSION: 24

jobs:
  build-test:
    name: Derleme ve testler
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Bağımlılıklar
        run: pnpm install --frozen-lockfile

      # Sunucudaki Windows PowerShell 5.1, BOM'suz UTF-8'i ANSI (cp1254) okur; Türkçe karakter
      # bozulur ve betik ayrıştırılamaz (2026-10-05 provasında yaşandı). PowerShell 7 bunu
      # yakalamaz, bu yüzden BOM'un kendisi kontrol edilir.
      - name: deploy/*.ps1 ve *.psd1 UTF-8 BOM'lu
        run: |
          bad=0
          for f in $(git ls-files 'deploy/*.ps1' 'deploy/*.psd1' 'deploy/**/*.psd1'); do
            if [ "$(head -c3 "$f" | od -An -tx1 | tr -d ' ')" != "efbbbf" ]; then echo "BOM yok: $f"; bad=1; fi
          done
          exit $bad

      - name: Prisma client
        working-directory: packages/backend
        run: npx prisma generate

      - name: shared — derleme ve tip kontrolü
        working-directory: packages/shared
        run: |
          pnpm run build
          pnpm run test

      - name: backend — derleme
        working-directory: packages/backend
        run: pnpm run build

      # GEÇİCİ: manifest.i18n hariç. WooCommerce'in 5 anahtarı locale dosyalarında yok ve test
      # "her anahtar her dilde" bekliyor; frontend çeviri sistemi yedek dil düzenine (en-US → tr)
      # taşınıyor. Anahtarlar ve testin bu düzene uyarlanması o işte çözülecek; bitince bu
      # bayrak kaldırılır. Karar: 2026-10-05.
      - name: backend — birim testleri
        working-directory: packages/backend
        run: npx jest --ci --testPathIgnorePatterns /node_modules/ 'manifest\.i18n\.spec\.ts'

      - name: frontend — testler
        working-directory: packages/frontend
        run: npx jest --ci

      - name: frontend — derleme
        working-directory: packages/frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.alqora.app/api
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm run build

  database:
    name: Migration ve RLS (boş Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kroptos_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kroptos_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Superuser: migration DDL + kroptos_app rolünü sıfırdan yaratır (yetişme migration'ı, Bölüm 2).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kroptos_ci
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/kroptos_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Bağımlılıklar
        run: pnpm install --frozen-lockfile

      - name: Prisma client
        working-directory: packages/backend
        run: npx prisma generate

      - name: Migration'lar boş veritabanına
        working-directory: packages/backend
        run: npx prisma migrate deploy

      - name: Şema farkı yok (migration'lar = schema.prisma)
        working-directory: packages/backend
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Kiracı tablolarında RLS
        working-directory: packages/backend
        run: node prisma/scripts/check-rls.js

      - name: Uygulama rolü RLS'i atlamıyor
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc \
            "select rolname, rolsuper, rolbypassrls from pg_roles where rolname='kroptos_app'" | tee /tmp/role.txt
          grep -qx 'kroptos_app|f|f' /tmp/role.txt
